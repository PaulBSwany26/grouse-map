name: Rebuild statewide stand summary

# Refreshes data/summary.json (zoomed-out hotspot view) from Michigan DNR and
# USFS open data every Monday, and on demand from the Actions tab.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node tools/test_habitat.mjs
      - run: pip install "shapely>=2" numpy
      - run: python tools/build_summary.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/summary.json; then
            echo "No change"; exit 0
          fi
          # Bump the service worker version so installed apps fetch the new data
          sed -i -E "s/const VERSION = 'v([0-9]+)(-d[0-9]+)?';/const VERSION = 'v\1-d$(date +%Y%m%d)';/" sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.json sw.js
          git commit -m "Weekly stand summary refresh"
          git push
